<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disjointed — 2D Mechanism Simulator</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group" id="mode-group">
          <button data-mode="draw" class="mode-btn active">Draw</button>
          <button data-mode="sim" class="mode-btn">Simulate</button>
        </div>
        <div class="group" id="tool-group">
          <button data-tool="body" class="tool-btn" title="Draw a body (B)">Body</button>
          <button data-tool="joint" class="tool-btn" title="Add a joint point to a body (J)">Joint</button>
          <button data-tool="connect" class="tool-btn" title="Pin two joints together (C)">Connect</button>
          <button data-tool="ground" class="tool-btn" title="Ground a joint — fixed position, free rotation (G)">Ground</button>
          <button data-tool="slider" class="tool-btn" title="Constrain a joint to slide along a line (S)">Slider</button>
          <button data-tool="rotate" class="tool-btn" title="Rotate a body about its centroid, or a node (drag); snaps to 45° (R)">Rotate</button>
        </div>
        <div class="group" id="edit-group">
          <button id="copy-btn" title="Copy the selected body (Ctrl+C)">Copy</button>
          <button id="paste-btn" title="Paste the copied body at the cursor (Ctrl+V)">Paste</button>
          <button id="mirror-h-btn" title="Mirror the selected body left↔right">Mirror H</button>
          <button id="mirror-v-btn" title="Mirror the selected body top↔bottom">Mirror V</button>
        </div>
        <div class="group" id="grid-group">
          <button id="grid-btn" class="active" title="Show or hide the grid (toggle)">Grid</button>
          <button id="snap-btn" title="Snap placement and dragging to the grid (toggle)">Snap</button>
          <label class="select-label" title="Grid spacing in world units (1–200)">
            <input id="grid-size" type="number" min="1" max="200" step="1" value="40" />
            <select id="grid-size-presets" title="Pick a preset grid size">
              <option value="" selected disabled hidden>·</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="25">25</option>
              <option value="40">40</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
        </div>
        <div class="group">
          <button id="save-btn" title="Save mechanism to a file">Save</button>
          <button id="load-btn" title="Load mechanism from a file">Load</button>
          <button id="clear-btn" title="Delete everything">Clear</button>
        </div>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
        <div class="spacer"></div>
        <div id="hint" class="hint"></div>
      </header>
      <canvas id="scene"></canvas>
      <div id="sim-error" class="hidden" role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
