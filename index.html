<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disjointed — 2D Mechanism Simulator</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group" id="mode-group">
          <button data-mode="draw" class="mode-btn active icon-btn" title="Draw mode — build the mechanism" aria-label="Draw mode">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17l1-4L14 3l3 3L7 16l-4 1z"/><path d="M12 5l3 3"/></svg>
          </button>
          <button data-mode="sim" class="mode-btn icon-btn" title="Simulate mode — drag to drive the mechanism" aria-label="Simulate mode">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l11 6-11 6z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="run-btn" class="icon-btn hidden" title="Run / pause actuator animation (Space)" aria-label="Run animation">
            <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l11 6-11 6z" fill="currentColor" stroke="none"/></svg>
            <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="4" height="12" fill="currentColor" stroke="none"/><rect x="11" y="4" width="4" height="12" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="autopause-btn" class="icon-btn hidden" title="Auto-pause the animation when the assembly is impossible" aria-label="Auto-pause on impossible assembly" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3 L17 16 L3 16 Z"/><line x1="10" y1="8" x2="10" y2="12.5"/><circle cx="10" cy="14.5" r="0.9" fill="currentColor" stroke="none"/></svg>
          </button>
          <!-- Solver tuning controls: values are seeded from solverConfig / animIterations in
               main.ts at startup, so no defaults live here. -->
          <label id="anim-iter-ctrl" class="iter-ctrl hidden" title="Max Phase-A sweeps per animation frame (higher = better convergence, slower; loop early-exits when satisfied)">
            <span class="prop-tag">it</span>
            <input id="anim-iter" type="range" min="10" max="300" step="10" />
            <span id="anim-iter-value" class="prop-unit"></span>
          </label>
          <label id="cleanup-max-ctrl" class="iter-ctrl hidden" title="Max cleanup sweeps (post-Phase-A convergence cap)">
            <span class="prop-tag">cl</span>
            <input id="cleanup-max" type="range" min="0" max="5000" step="100" />
            <span id="cleanup-max-value" class="prop-unit"></span>
          </label>
          <label id="struct-tol-ctrl" class="iter-ctrl hidden" title="Structural tolerance — convergence target (world units)">
            <span class="prop-tag">st</span>
            <input id="struct-tol" type="number" step="any" min="0" />
          </label>
          <label id="break-tol-ctrl" class="iter-ctrl hidden" title="Break tolerance — final per-constraint error above which a constraint is flagged as broken (world units)">
            <span class="prop-tag">br</span>
            <input id="break-tol" type="number" step="any" min="0" />
          </label>
        </div>
        <div class="group" id="tool-group">
          <button data-tool="body" class="tool-btn icon-btn" title="Draw a body (B)" aria-label="Body tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4h6a3 3 0 0 1 3 3v3a4 4 0 0 1-4 4H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z" fill="currentColor" fill-opacity="0.18"/></svg>
          </button>
          <button data-tool="joint" class="tool-btn icon-btn" title="Add a joint point to a body (J)" aria-label="Joint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4.5"/><circle cx="10" cy="10" r="1.3" fill="currentColor" stroke="none"/></svg>
          </button>
          <button data-tool="connect" class="tool-btn icon-btn" title="Pin two joints together (C)" aria-label="Connect tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="15" r="2.5"/><circle cx="15" cy="5" r="2.5"/><line x1="6.8" y1="13.2" x2="13.2" y2="6.8"/></svg>
          </button>
          <button data-tool="ground" class="tool-btn icon-btn" title="Ground a joint (fixed position, free rotation) or a body / group (fixed entirely); click again to unground (G)" aria-label="Ground tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="4" r="1.6"/><line x1="10" y1="5.6" x2="10" y2="10"/><line x1="4" y1="10" x2="16" y2="10"/><line x1="6" y1="10" x2="4" y2="14"/><line x1="9" y1="10" x2="7" y2="14"/><line x1="12" y1="10" x2="10" y2="14"/><line x1="15" y1="10" x2="13" y2="14"/></svg>
          </button>
          <button data-tool="slider" class="tool-btn icon-btn" title="Constrain a joint to slide along a line (S)" aria-label="Slider tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="7" x2="3" y2="13"/><line x1="17" y1="7" x2="17" y2="13"/><rect x="7" y="6.5" width="6" height="7" rx="1.2" fill="currentColor" fill-opacity="0.18"/></svg>
          </button>
          <button data-tool="guide" class="tool-btn icon-btn" title="Construction guideline — click two points to place an infinite line; points land on joints / corners / edges, and snapping prefers guidelines over the grid (L)" aria-label="Guideline tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="2.5" y1="17.5" x2="17.5" y2="2.5" stroke-dasharray="4 2"/><circle cx="7" cy="13" r="1.7" fill="currentColor" stroke="none"/><circle cx="13" cy="7" r="1.7" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div class="group" id="edit-group">
          <button data-tool="rotate" class="tool-btn icon-btn" title="Rotate a body about its centroid, or a node (drag); snaps to 45° (R)" aria-label="Rotate tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 7a6 6 0 1 0 1.3 4.2"/><path d="M15.4 3.6v3.6h-3.6"/></svg>
          </button>
          <button id="mirror-h-btn" class="icon-btn" title="Mirror the selected body left↔right" aria-label="Mirror horizontally">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="10" y1="3" x2="10" y2="17" stroke-dasharray="2 2"/><path d="M8 6L4 10l4 4z" fill="currentColor" fill-opacity="0.18"/><path d="M12 6l4 4-4 4z" fill="currentColor" fill-opacity="0.18"/></svg>
          </button>
          <button id="mirror-v-btn" class="icon-btn" title="Mirror the selected body top↔bottom" aria-label="Mirror vertically">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="3" y1="10" x2="17" y2="10" stroke-dasharray="2 2"/><path d="M6 8l4-4 4 4z" fill="currentColor" fill-opacity="0.18"/><path d="M6 12l4 4 4-4z" fill="currentColor" fill-opacity="0.18"/></svg>
          </button>
          <button id="send-back-btn" class="icon-btn" title="Send the selected body / selection behind everything else (PageDown)" aria-label="Send to back">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="9" height="3.4" rx="1"/><rect x="3" y="8.3" width="9" height="3.4" rx="1"/><rect x="3" y="13.1" width="9" height="3.4" rx="1" fill="currentColor" fill-opacity="0.35"/><path d="M15.5 4.5v11M13.3 13.3l2.2 2.2 2.2-2.2"/></svg>
          </button>
          <button id="bring-front-btn" class="icon-btn" title="Bring the selected body / selection in front of everything else (PageUp)" aria-label="Bring to front">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="9" height="3.4" rx="1" fill="currentColor" fill-opacity="0.35"/><rect x="3" y="8.3" width="9" height="3.4" rx="1"/><rect x="3" y="13.1" width="9" height="3.4" rx="1"/><path d="M15.5 15.5v-11M13.3 6.7l2.2-2.2 2.2 2.2"/></svg>
          </button>
        </div>
        <div class="group" id="actuator-group">
          <button data-tool="linearActuator" class="tool-btn icon-btn" title="Create a linear actuator on a slider — auto-travels back and forth in animation (A)" aria-label="Linear actuator tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="7" x2="3" y2="13"/><line x1="17" y1="7" x2="17" y2="13"/><circle cx="10" cy="10" r="2.3" fill="currentColor" stroke="none"/><path d="M6 10l-2-1.6M6 10l-2 1.6" /><path d="M14 10l2-1.6M14 10l2 1.6" /></svg>
          </button>
          <button data-tool="motor" class="tool-btn icon-btn" title="Create a motor on a body — pick pivot then crank pin; spins in animation (M)" aria-label="Motor tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="1.5" fill="currentColor" stroke="none"/><line x1="10" y1="10" x2="15" y2="6.5"/><circle cx="15" cy="6.5" r="1.6" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div class="group" id="measure-group">
          <button data-tool="measure" class="tool-btn icon-btn" title="Measure — click two references (points or lines), then place the value (D)" aria-label="Measure tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="7.5" width="15" height="5.5" rx="1"/><line x1="6" y1="7.5" x2="6" y2="10.2"/><line x1="9.5" y1="7.5" x2="9.5" y2="10.2"/><line x1="13" y1="7.5" x2="13" y2="10.2"/></svg>
          </button>
          <button id="measure-vis-btn" class="active icon-btn" title="Show or hide all measurements (toggle)" aria-label="Toggle measurement visibility">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="3" y1="5" x2="3" y2="15"/><line x1="17" y1="5" x2="17" y2="15"/><line x1="3" y1="10" x2="17" y2="10"/><path d="M6.5 8L3 10l3.5 2"/><path d="M13.5 8L17 10l-3.5 2"/></svg>
          </button>
        </div>
        <div class="group" id="sketch-group">
          <button data-tool="coincident" class="tool-btn icon-btn" title="Coincident — click two points to make them share a position (O)" aria-label="Coincident constraint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5.5"/><circle cx="10" cy="10" r="1.6" fill="currentColor" stroke="none"/></svg>
          </button>
          <button data-tool="horizontal" class="tool-btn icon-btn" title="Horizontal — click an edge or rail, or two points (H)" aria-label="Horizontal constraint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="4" y1="10" x2="16" y2="10"/><circle cx="4" cy="10" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1.6" fill="currentColor" stroke="none"/></svg>
          </button>
          <button data-tool="vertical" class="tool-btn icon-btn" title="Vertical — click an edge or rail, or two points (V)" aria-label="Vertical constraint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="10" y1="4" x2="10" y2="16"/><circle cx="10" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="10" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>
          </button>
          <button data-tool="parallel" class="tool-btn icon-btn" title="Parallel — click two lines (edges or rails) (P)" aria-label="Parallel constraint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="6" y1="16" x2="11" y2="4"/><line x1="10.5" y1="16" x2="15.5" y2="4"/></svg>
          </button>
          <button data-tool="perpendicular" class="tool-btn icon-btn" title="Perpendicular — click two lines (edges or rails) (T)" aria-label="Perpendicular constraint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="4" y1="15" x2="16" y2="15"/><line x1="10" y1="15" x2="10" y2="4"/></svg>
          </button>
          <button data-tool="equal" class="tool-btn icon-btn" title="Equal length — click two lines (edges or rails) (E)" aria-label="Equal constraint tool">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="5" y1="8" x2="15" y2="8"/><line x1="5" y1="12" x2="15" y2="12"/></svg>
          </button>
          <button id="sketch-vis-btn" class="active icon-btn" title="Show or hide all constraint badges (toggle)" aria-label="Toggle constraint badge visibility">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3.5" width="13" height="13" rx="3"/><line x1="6.5" y1="13" x2="13.5" y2="13"/><line x1="10" y1="13" x2="10" y2="7"/></svg>
          </button>
        </div>
        <div class="group hidden" id="actuator-props">
          <label class="select-label" id="actuator-speed-label" title="Cycles per second (one back-and-forth per cycle)">
            <span class="prop-tag">▶◀</span>
            <input id="actuator-speed" type="number" min="0" step="0.05" value="0.5" />
            <span class="prop-unit">Hz</span>
          </label>
          <div class="profile-toggle" id="actuator-profile" role="group" aria-label="Linear actuator motion profile">
            <button type="button" data-profile="triangle" title="Triangle wave — constant speed end to end">/\</button>
            <button type="button" data-profile="sine" title="Sine wave — smooth ease in/out at the endstops">~</button>
          </div>
        </div>
        <div class="group hidden" id="motor-props">
          <label class="select-label" title="Revolutions per second">
            <span class="prop-tag">↻</span>
            <input id="motor-speed" type="number" min="0" step="0.05" value="0.25" />
            <span class="prop-unit">Hz</span>
          </label>
        </div>
        <div class="group" id="color-group">
          <input id="body-color" type="color" value="#4f9dff"
            title="Body colour — with a body selected, recolours it; otherwise sets the colour for new bodies"
            aria-label="Body colour" />
        </div>
        <div class="group" id="grid-group">
          <button id="grid-btn" class="active icon-btn" title="Show or hide the grid (toggle)" aria-label="Toggle grid">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="7" y1="3" x2="7" y2="17"/><line x1="13" y1="3" x2="13" y2="17"/><line x1="3" y1="7" x2="17" y2="7"/><line x1="3" y1="13" x2="17" y2="13"/></svg>
          </button>
          <button id="snap-btn" class="icon-btn" title="Snap placement and dragging to the grid (toggle)" aria-label="Toggle snap to grid">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3v7a4 4 0 0 0 8 0V3"/><line x1="4" y1="3" x2="8" y2="3"/><line x1="12" y1="3" x2="16" y2="3"/><line x1="6" y1="10" x2="6" y2="12"/><line x1="14" y1="10" x2="14" y2="12"/></svg>
          </button>
          <label class="select-label" title="Working units — what one world unit means; measurements display it and DXF import converts into it (saved with the file)">
            <select id="unit-select" aria-label="Working units">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
              <option value="in">in</option>
            </select>
          </label>
          <label class="select-label" title="Grid spacing in working units (1–200)">
            <input id="grid-size" type="number" min="1" max="200" step="any" value="40" />
            <select id="grid-size-presets" title="Pick a preset grid size">
              <option value="" selected disabled hidden>·</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="25">25</option>
              <option value="40">40</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </label>
        </div>
        <div class="group" id="view-group">
          <button id="fit-btn" class="icon-btn" title="Fit the mechanism to the screen (F)" aria-label="Fit to screen">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V4.5A1.5 1.5 0 0 1 4.5 3H7"/><path d="M13 3h2.5A1.5 1.5 0 0 1 17 4.5V7"/><path d="M17 13v2.5a1.5 1.5 0 0 1-1.5 1.5H13"/><path d="M7 17H4.5A1.5 1.5 0 0 1 3 15.5V13"/><rect x="7" y="8" width="6" height="4" rx="1" fill="currentColor" fill-opacity="0.18"/></svg>
          </button>
        </div>
        <div class="group">
          <button id="save-btn" class="icon-btn" title="Save mechanism to a file" aria-label="Save">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h9l3 3v9H4z"/><path d="M7 4v4h6V5"/><rect x="7" y="11" width="6" height="5"/></svg>
          </button>
          <button id="load-btn" class="icon-btn" title="Load mechanism from a file" aria-label="Load">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h3l2 2h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
          </button>
          <button id="clear-btn" class="icon-btn icon-btn-danger" title="Delete everything" aria-label="Clear all">
            <svg viewBox="0 0 20 20" aria-hidden="true"><line x1="5" y1="6" x2="15" y2="6"/><path d="M8 6V4h4v2"/><path d="M6.5 6l.7 10h5.6l.7-10"/><line x1="9" y1="9" x2="9" y2="13"/><line x1="11" y1="9" x2="11" y2="13"/></svg>
          </button>
        </div>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
        <div class="group">
          <button id="theme-btn" class="icon-btn" title="Toggle light / dark theme" aria-label="Toggle light or dark theme">
            <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="10" y1="16" x2="10" y2="18"/><line x1="2" y1="10" x2="4" y2="10"/><line x1="16" y1="10" x2="18" y2="10"/><line x1="4.3" y1="4.3" x2="5.7" y2="5.7"/><line x1="14.3" y1="14.3" x2="15.7" y2="15.7"/><line x1="4.3" y1="15.7" x2="5.7" y2="14.3"/><line x1="14.3" y1="5.7" x2="15.7" y2="4.3"/></svg>
            <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 11.6A6.6 6.6 0 0 1 8.4 4 6.6 6.6 0 1 0 16 11.6z" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
        <div class="spacer"></div>
        <div id="hint" class="hint"></div>
      </header>
      <div id="canvas-wrap">
        <canvas id="scene"></canvas>
        <div id="sim-error" class="hidden" role="alert"></div>
        <!-- Inline value editor for a draw-mode dimension (double-click its label).
             Enter commits (drives the dimension); empty commits back to driven; Esc cancels. -->
        <input id="dim-edit" class="hidden" type="text" inputmode="decimal" autocomplete="off"
          aria-label="Dimension value" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
